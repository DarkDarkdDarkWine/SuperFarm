<!-- 精美农场背景 SVG - 纯代码绘制 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- 天空渐变 -->
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#B8E6F0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0F6FF;stop-opacity:1" />
    </linearGradient>
    
    <!-- 太阳光芒 -->
    <radialGradient id="sunGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFF9C4;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#FFEB3B;stop-opacity:0.9" />
      <stop offset="70%" style="stop-color:#FFC107;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#FF9800;stop-opacity:0" />
    </radialGradient>
    
    <!-- 草地渐变 -->
    <linearGradient id="grassGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8BC34A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#689F38;stop-opacity:1" />
    </linearGradient>
    
    <!-- 远山渐变 -->
    <linearGradient id="mountainGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#A5D6A7;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#66BB6A;stop-opacity:0.9" />
    </linearGradient>
    
    <!-- 云朵渐变 -->
    <linearGradient id="cloudGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.95" />
      <stop offset="100%" style="stop-color:#F5F5F5;stop-opacity:0.9" />
    </linearGradient>
    
    <!-- 谷仓红色 -->
    <linearGradient id="barnRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E53935;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#F44336;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D32F2F;stop-opacity:1" />
    </linearGradient>
    
    <!-- 屋顶渐变 -->
    <linearGradient id="roofGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#5D4037;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3E2723;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 天空背景 -->
  <rect width="1200" height="800" fill="url(#skyGradient)"/>
  
  <!-- 太阳光芒 -->
  <g transform="translate(150, 120)">
    <circle cx="0" cy="0" r="80" fill="url(#sunGradient)"/>
    <circle cx="0" cy="0" r="50" fill="#FFF9C4"/>
    <!-- 光芒 -->
    <g opacity="0.4">
      <ellipse cx="0" cy="-100" rx="8" ry="25" fill="#FFEB3B" transform="rotate(0)"/>
      <ellipse cx="0" cy="-100" rx="8" ry="25" fill="#FFEB3B" transform="rotate(30)"/>
      <ellipse cx="0" cy="-100" rx="8" ry="25" fill="#FFEB3B" transform="rotate(60)"/>
      <ellipse cx="0" cy="-100" rx="8" ry="25" fill="#FFEB3B" transform="rotate(90)"/>
      <ellipse cx="0" cy="-100" rx="8" ry="25" fill="#FFEB3B" transform="rotate(120)"/>
      <ellipse cx="0" cy="-100" rx="8" ry="25" fill="#FFEB3B" transform="rotate(150)"/>
      <ellipse cx="0" cy="-100" rx="8" ry="25" fill="#FFEB3B" transform="rotate(180)"/>
      <ellipse cx="0" cy="-100" rx="8" ry="25" fill="#FFEB3B" transform="rotate(210)"/>
      <ellipse cx="0" cy="-100" rx="8" ry="25" fill="#FFEB3B" transform="rotate(240)"/>
      <ellipse cx="0" cy="-100" rx="8" ry="25" fill="#FFEB3B" transform="rotate(270)"/>
      <ellipse cx="0" cy="-100" rx="8" ry="25" fill="#FFEB3B" transform="rotate(300)"/>
      <ellipse cx="0" cy="-100" rx="8" ry="25" fill="#FFEB3B" transform="rotate(330)"/>
    </g>
  </g>
  
  <!-- 远处的山 -->
  <path d="M0,500 Q200,350 400,450 Q600,300 800,420 Q1000,350 1200,480 L1200,800 L0,800 Z" fill="url(#mountainGradient)"/>
  
  <!-- 后层云朵 -->
  <g opacity="0.8">
    <ellipse cx="200" cy="150" rx="60" ry="25" fill="url(#cloudGradient)"/>
    <ellipse cx="230" cy="140" rx="45" ry="20" fill="url(#cloudGradient)"/>
    <ellipse cx="170" cy="145" rx="40" ry="18" fill="url(#cloudGradient)"/>
    
    <ellipse cx="900" cy="100" rx="70" ry="30" fill="url(#cloudGradient)"/>
    <ellipse cx="940" cy="85" rx="50" ry="25" fill="url(#cloudGradient)"/>
    <ellipse cx="860" cy="90" rx="45" ry="22" fill="url(#cloudGradient)"/>
    
    <ellipse cx="550" cy="180" rx="55" ry="22" fill="url(#cloudGradient)"/>
    <ellipse cx="580" cy="170" rx="40" ry="18" fill="url(#cloudGradient)"/>
  </g>
  
  <!-- 起伏的绿色山丘 -->
  <path d="M0,800 L0,550 Q150,500 300,530 Q500,480 700,520 Q900,460 1200,540 L1200,800 Z" fill="#7CB342"/>
  <path d="M0,800 L0,600 Q200,560 400,590 Q600,550 800,580 Q1000,540 1200,600 L1200,800 Z" fill="url(#grassGradient)"/>
  
  <!-- 红色谷仓 -->
  <g transform="translate(80, 420)">
    <!-- 谷仓主体 -->
    <rect x="20" y="80" width="140" height="120" fill="url(#barnRed)" rx="3"/>
    <!-- 谷仓屋顶 -->
    <path d="M10,80 L90,20 L170,80 Z" fill="url(#roofGradient)"/>
    <!-- 白色装饰线 -->
    <path d="M90,20 L90,200" stroke="white" stroke-width="3" opacity="0.8"/>
    <line x1="20" y1="80" x2="160" y2="80" stroke="white" stroke-width="2" opacity="0.6"/>
    <line x1="20" y1="140" x2="160" y2="140" stroke="white" stroke-width="2" opacity="0.6"/>
    <!-- 门 -->
    <rect x="70" y="140" width="40" height="60" fill="#5D4037" rx="2"/>
    <!-- 窗户 -->
    <rect x="35" y="100" width="25" height="25" fill="#E3F2FD" stroke="white" stroke-width="2"/>
    <line x1="47" y1="100" x2="47" y2="125" stroke="white" stroke-width="1.5"/>
    <line x1="35" y1="112" x2="60" y2="112" stroke="white" stroke-width="1.5"/>
    <rect x="120" y="100" width="25" height="25" fill="#E3F2FD" stroke="white" stroke-width="2"/>
    <line x1="132" y1="100" x2="132" y2="125" stroke="white" stroke-width="1.5"/>
    <line x1="120" y1="112" x2="145" y2="112" stroke="white" stroke-width="1.5"/>
    <!-- 干草堆 -->
    <rect x="170" y="160" width="35" height="25" fill="#FFB74D" rx="3"/>
    <line x1="175" y1="165" x2="200" y2="165" stroke="#F57C00" stroke-width="1"/>
    <line x1="175" y1="172" x2="200" y2="172" stroke="#F57C00" stroke-width="1"/>
    <line x1="175" y1="179" x2="200" y2="179" stroke="#F57C00" stroke-width="1"/>
  </g>
  
  <!-- 风车 -->
  <g transform="translate(300, 380)">
    <!-- 风车塔身 -->
    <path d="M20,120 L30,200 L70,200 L80,120 Z" fill="#F5F5F5" stroke="#E0E0E0" stroke-width="1"/>
    <ellipse cx="50" cy="120" rx="30" ry="8" fill="#E0E0E0"/>
    <!-- 风车叶片 -->
    <g transform="translate(50, 90)">
      <rect x="-3" y="-60" width="6" height="120" fill="#8D6E63" rx="2"/>
      <rect x="-60" y="-3" width="120" height="6" fill="#8D6E63" rx="2"/>
      <circle cx="0" cy="0" r="8" fill="#5D4037"/>
      <!-- 帆 -->
      <rect x="5" y="-55" width="25" height="50" fill="white" opacity="0.9"/>
      <rect x="-30" y="5" width="50" height="25" fill="white" opacity="0.9"/>
      <rect x="-30" y="-30" width="50" height="25" fill="white" opacity="0.9"/>
      <rect x="5" y="5" width="25" height="50" fill="white" opacity="0.9"/>
    </g>
    <!-- 门 -->
    <rect x="40" y="170" width="20" height="30" fill="#8D6E63" rx="2"/>
  </g>
  
  <!-- 木栅栏 -->
  <g transform="translate(0, 580)">
    <defs>
      <pattern id="fencePattern" x="0" y="0" width="100" height="80" patternUnits="userSpaceOnUse">
        <rect x="5" y="0" width="8" height="70" fill="#8D6E63" rx="2"/>
        <rect x="25" y="5" width="8" height="65" fill="#A1887F" rx="2"/>
        <rect x="45" y="0" width="8" height="70" fill="#8D6E63" rx="2"/>
        <rect x="65" y="5" width="8" height="65" fill="#A1887F" rx="2"/>
        <rect x="85" y="0" width="8" height="70" fill="#8D6E63" rx="2"/>
        <rect x="0" y="20" width="100" height="6" fill="#6D4C41" rx="2"/>
        <rect x="0" y="45" width="100" height="6" fill="#6D4C41" rx="2"/>
      </pattern>
    </defs>
    <rect x="450" y="0" width="300" height="80" fill="url(#fencePattern)" opacity="0.9"/>
    <rect x="850" y="10" width="250" height="75" fill="url(#fencePattern)" opacity="0.85"/>
  </g>
  
  <!-- 果树 -->
  <g transform="translate(1050, 480)">
    <!-- 树干 -->
    <rect x="35" y="60" width="20" height="60" fill="#8D6E63" rx="3"/>
    <!-- 树冠 -->
    <circle cx="25" cy="50" r="30" fill="#66BB6A"/>
    <circle cx="45" cy="45" r="35" fill="#4CAF50"/>
    <circle cx="65" cy="50" r="30" fill="#66BB6A"/>
    <circle cx="45" cy="25" r="32" fill="#81C784"/>
    <!-- 苹果 -->
    <circle cx="30" cy="45" r="5" fill="#EF5350"/>
    <circle cx="55" cy="35" r="5" fill="#EF5350"/>
    <circle cx="60" cy="55" r="5" fill="#EF5350"/>
    <circle cx="40" cy="60" r="5" fill="#EF5350"/>
  </g>
  
  <!-- 小路 -->
  <path d="M350,800 Q400,720 380,650 Q360,600 400,580" stroke="#D7CCC8" stroke-width="40" fill="none" opacity="0.7"/>
  <path d="M350,800 Q400,720 380,650 Q360,600 400,580" stroke="#BCAAA4" stroke-width="30" fill="none" opacity="0.5"/>
  
  <!-- 前层花朵 -->
  <g>
    <!-- 花朵1 -->
    <g transform="translate(150, 680)">
      <circle cx="0" cy="-8" r="6" fill="#FFEB3B"/>
      <circle cx="8" cy="0" r="6" fill="#FFEB3B"/>
      <circle cx="0" cy="8" r="6" fill="#FFEB3B"/>
      <circle cx="-8" cy="0" r="6" fill="#FFEB3B"/>
      <circle cx="0" cy="0" r="5" fill="#FF9800"/>
      <rect x="-1" y="8" width="2" height="15" fill="#4CAF50"/>
    </g>
    <!-- 花朵2 -->
    <g transform="translate(500, 720)">
      <circle cx="0" cy="-8" r="6" fill="#E91E63"/>
      <circle cx="8" cy="0" r="6" fill="#E91E63"/>
      <circle cx="0" cy="8" r="6" fill="#E91E63"/>
      <circle cx="-8" cy="0" r="6" fill="#E91E63"/>
      <circle cx="0" cy="0" r="5" fill="#FFC107"/>
      <rect x="-1" y="8" width="2" height="15" fill="#4CAF50"/>
    </g>
    <!-- 花朵3 -->
    <g transform="translate(800, 690)">
      <circle cx="0" cy="-8" r="6" fill="#9C27B0"/>
      <circle cx="8" cy="0" r="6" fill="#9C27B0"/>
      <circle cx="0" cy="8" r="6" fill="#9C27B0"/>
      <circle cx="-8" cy="0" r="6" fill="#9C27B0"/>
      <circle cx="0" cy="0" r="5" fill="#FFEB3B"/>
      <rect x="-1" y="8" width="2" height="15" fill="#4CAF50"/>
    </g>
    <!-- 花朵4 -->
    <g transform="translate(1000, 750)">
      <circle cx="0" cy="-8" r="6" fill="#FF5722"/>
      <circle cx="8" cy="0" r="6" fill="#FF5722"/>
      <circle cx="0" cy="8" r="6" fill="#FF5722"/>
      <circle cx="-8" cy="0" r="6" fill="#FF5722"/>
      <circle cx="0" cy="0" r="5" fill="#FFEB3B"/>
      <rect x="-1" y="8" width="2" height="15" fill="#4CAF50"/>
    </g>
  </g>
  
  <!-- 前层云朵 -->
  <g opacity="0.9">
    <ellipse cx="350" cy="100" rx="50" ry="20" fill="url(#cloudGradient)"/>
    <ellipse cx="375" cy="92" rx="38" ry="16" fill="url(#cloudGradient)"/>
    <ellipse cx="325" cy="95" rx="35" ry="15" fill="url(#cloudGradient)"/>
    
    <ellipse cx="750" cy="140" rx="45" ry="18" fill="url(#cloudGradient)"/>
    <ellipse cx="770" cy="132" rx="35" ry="14" fill="url(#cloudGradient)"/>
    <ellipse cx="730" cy="135" rx="30" ry="13" fill="url(#cloudGradient)"/>
  </g>
  
  <!-- 飞鸟 -->
  <g opacity="0.6">
    <path d="M600,200 Q605,195 610,200 Q615,195 620,200" stroke="#5D4037" stroke-width="2" fill="none"/>
    <path d="M650,180 Q655,175 660,180 Q665,175 670,180" stroke="#5D4037" stroke-width="2" fill="none"/>
    <path d="M580,220 Q585,215 590,220 Q595,215 600,220" stroke="#5D4037" stroke-width="2" fill="none"/>
  </g>
  
  <!-- 柔和光晕效果 -->
  <rect width="1200" height="800" fill="url(#sunGradient)" opacity="0.1" style="mix-blend-mode: overlay;"/>
</svg>